server {
  listen 80;
  server_name _;

  client_max_body_size 20M;

  root /usr/share/nginx/html;
  index index.html;

  # API / realtime -> backend server
  location /socket.io/ {
    proxy_pass https://brisa-padel-server.onrender.com;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host brisa-padel-server.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(api|auth)/ {
    proxy_pass https://brisa-padel-server.onrender.com;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_set_header Host brisa-padel-server.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/v1/ {
    proxy_pass https://brisa-padel-server.onrender.com;
    proxy_ssl_server_name on;
    proxy_redirect off;
    proxy_set_header Host brisa-padel-server.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # React-owned explicit pages redirect to the portal app
  # location = /request-access {
  #   return 302 https://stage.brisapadel.com/request-access;
  # }

  # location = /es/request-access {
  #   return 302 https://stage.brisapadel.com/es/request-access;
  # }

  # location = /login {
  #   return 302 https://stage.brisapadel.com/login;
  # }

  # Astro-owned pages (force these to win before React fallback)
  location = / { try_files /index.html =404; }
  location = /es { return 301 /es/; }
  location = /es/ { try_files /es/index.html =404; }

  location ^~ /home { try_files /home/index.html =404; }
  location ^~ /about { try_files /about/index.html =404; }
  location ^~ /contact { try_files /contact/index.html =404; }
  location ^~ /terms { try_files /terms/index.html =404; }
  location ^~ /privacy { try_files /privacy/index.html =404; }
  location ^~ /membership { try_files /membership/index.html =404; }

  location ^~ /es/about { try_files /es/about/index.html =404; }
  location ^~ /es/contact { try_files /es/contact/index.html =404; }
  location ^~ /es/terms { try_files /es/terms/index.html =404; }
  location ^~ /es/privacy { try_files /es/privacy/index.html =404; }
  location ^~ /es/home { try_files /es/home/index.html =404; }
  location ^~ /es/membership { try_files /es/membership/index.html =404; }

  # Astro static files (if present)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
