name: prod-deploy

on:
  push:
    branches:
      - next-js-setup

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to checkout"
        required: true
        default: "next-js-setup"

      print_only:
        description: "Dry run — print the docker commands without running them"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGE_EC2_HOST_V1 }}
          username: ubuntu
          key: ${{ secrets.STAGE_PEM_KEY_V1 }}
          port: 22

          script: |
            set -e

            PRINT_ONLY="${{ github.event.inputs.print_only || 'false' }}"
            BRANCH="${{ github.event.inputs.branch || 'next-js-setup' }}"

            # Where the Next.js server reaches the API for server-rendered pages.
            # Both containers are on the `brisa` network, so this is the API
            # container's name, NOT localhost — localhost inside this container
            # is the container itself.
            API_BASE_URL="${{ vars.CLUBS_API_BASE_URL }}"
            if [ -z "$API_BASE_URL" ]; then
              API_BASE_URL="http://brisa-padel-server:8000"
            fi

            cd /opt/work

            # Remove previous source
            rm -rf brisa-padel-site

            # Clone repository
            git clone https://x-access-token:${{ vars.STAGE_GH_TOKEN }}@github.com/BrisaPadel/brisa-padel-site.git

            cd brisa-padel-site

            # Checkout requested branch
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            if [ "$PRINT_ONLY" = "true" ]; then
              echo "PRINT ONLY — would run:"
              echo "  sudo docker build -t brisa-padel-site ."
              echo "  sudo docker stop brisa-padel-site"
              echo "  sudo docker rm brisa-padel-site"
              echo "  sudo docker run -d --name brisa-padel-site -p 7000:3000 -e CLUBS_API_BASE_URL=$API_BASE_URL --restart unless-stopped --network brisa brisa-padel-site"
              exit 0
            fi

            echo "Building Docker image..."

            sudo docker build -t brisa-padel-site .

            echo "Stopping existing container..."

            sudo docker stop brisa-padel-site || true
            sudo docker rm brisa-padel-site || true

            echo "Starting new container..."

            # The app is a Node server now, not nginx: it listens on 3000 inside
            # the container. The host port stays 7000 so the reverse proxy in
            # front of it does not need to change.
            sudo docker run -d \
              --name brisa-padel-site \
              -p 7000:3000 \
              -e CLUBS_API_BASE_URL="$API_BASE_URL" \
              --restart unless-stopped \
              --network brisa \
              brisa-padel-site

            echo "Deployment completed."

            sudo docker ps --filter "name=brisa-padel-site"

            # Fail the deploy if the site does not actually answer.
            echo "Waiting for the site to respond..."
            for attempt in $(seq 1 20); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7000/ || true)
              if [ "$STATUS" = "200" ]; then
                echo "Site is up (HTTP $STATUS)."
                CLUBS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7000/clubs || true)
                echo "/clubs returned HTTP $CLUBS"
                exit 0
              fi
              echo "  attempt $attempt: HTTP $STATUS, retrying in 3s"
              sleep 3
            done

            echo "Site did not become healthy — last 50 log lines:"
            sudo docker logs --tail 50 brisa-padel-site
            exit 1
